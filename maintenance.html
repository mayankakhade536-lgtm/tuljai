<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #0a192f;
  color: white;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Background glow */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #64ffda22, transparent 70%);
  animation: glow 6s infinite alternate;
  z-index: 0;
}

@keyframes glow {
  from { opacity: 0.3; }
  to { opacity: 0.8; }
}

.container {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 20px;
  width: 100%;
  max-width: 1000px;
}

/* Logo */
.logo {
  font-size: clamp(20px, 4vw, 28px);
  font-weight: 700;
  color: #64ffda;
  margin-bottom: 10px;
}

.logo span {
  color: white;
  font-weight: 300;
}

/* Title */
h1 {
  font-size: clamp(1.8rem, 5vw, 3.5rem);
  margin: 20px 0;
}

.highlight {
  color: #64ffda;
}

/* Subtitle */
p {
  color: #ccd6f6;
  margin-bottom: 30px;
  font-size: clamp(14px, 2.5vw, 18px);
}

/* Gear animation */
.gear {
  font-size: clamp(40px, 8vw, 60px);
  animation: spin 4s linear infinite;
  margin: 20px 0;
}
a{
  text-decoration: none;
  color: #ccd6f6;
}
@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* Features */
.features {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  margin: 30px 0;
}

.card {
  flex: 1 1 200px;
  max-width: 220px;
  border: 1px solid #233554;
  padding: 15px;
  border-radius: 10px;
  transition: 0.3s;
}

.card:hover {
  border-color: #64ffda;
  transform: translateY(-5px);
}

/* Countdown */
.countdown {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  margin: 30px 0;
}

.time-box {
  background: #112240;
  padding: 15px;
  border-radius: 10px;
  min-width: 70px;
}

.time-box h2 {
  color: #64ffda;
}

/* Contact */
.contact {
  margin-top: 20px;
  font-size: 14px;
  color: #8892b0;
}

/* Footer */
.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #64ffda;
  letter-spacing: 2px;
}

/* Mobile tuning */
@media (max-width: 500px) {
  .card {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="gear">⚙️</div>

  <div class="features">

    <div class="card">🔒 Better Security</div>
    <div class="card">🚀 Fast Performance</div>

  </div>

    POWERING A BETTER TOMORROW

<script>
const launchDate = new Date("May 30, 2026 00:00:00").getTime();

const timer = setInterval(function () {
  const now = new Date().getTime();
  const distance = launchDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / (1000 * 60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("days").innerText = days;
  document.getElementById("hours").innerText = hours;
  document.getElementById("minutes").innerText = minutes;
  document.getElementById("seconds").innerText = seconds;

  if (distance < 0) {
    clearInterval(timer);
    document.querySelector(".countdown").innerHTML = "We're Live 🚀";
  }
}, 1000);
</script>
